<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Board background -->
  <rect x="30" y="40" width="140" height="120" rx="12" fill="#9a6438" stroke="#754722" stroke-width="2"/>
  
  <!-- Wood grain effect -->
  <rect x="30" y="40" width="140" height="120" rx="12" fill="url(#woodGradient)" opacity="0.3"/>
  
  <!-- Cutting lines on board -->
  <line x1="50" y1="60" x2="150" y2="60" stroke="#fff8ef" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="85" x2="150" y2="85" stroke="#fff8ef" stroke-width="2" opacity="0.4"/>
  <line x1="50" y1="110" x2="150" y2="110" stroke="#fff8ef" stroke-width="2" opacity="0.6"/>
  <line x1="50" y1="135" x2="150" y2="135" stroke="#fff8ef" stroke-width="2" opacity="0.4"/>
  
  <!-- Knife -->
  <g transform="translate(100, 100) rotate(-35)">
    <rect x="-4" y="-50" width="8" height="45" fill="#314d3b" rx="2"/>
    <polygon points="0,-50 -8,-45 0,-40 8,-45" fill="#314d3b"/>
    <rect x="-5" y="0" width="10" height="12" fill="#8b7355" rx="2"/>
  </g>
  
  <!-- Ohio circle -->
  <circle cx="165" cy="50" r="18" fill="#314d3b" stroke="#fff8ef" stroke-width="2"/>
  <text x="165" y="57" font-family="Arial, sans-serif" font-weight="bold" font-size="18" fill="#fff8ef" text-anchor="middle">OH</text>
  
  <!-- Defs for gradients -->
  <defs>
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#754722;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#9a6438;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#754722;stop-opacity:0.3" />
    </linearGradient>
  </defs>
</svg>